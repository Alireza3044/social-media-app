{% extends "base.html" %}

{% block content %}
  <form method="post" enctype="multipart/form-data">
    <h2 class="text-2xl">Create Post</h2>
    {% csrf_token %}
    {{ form.as_div }}
    <button class="bg-blue-500 text-white font-bold mt-4 px-4 py-2 w-full rounded-lg cursor-pointer" type="submit">Create</button>
  </form>
{% endblock content %}
