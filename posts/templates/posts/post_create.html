{% extends "base.html" %}

{% block content %}
  <div class="container mx-auto h-full flex justify-center items-center">
    <div class="shadow-2xl px-10 py-6 rounded-lg w-90">
      <form method="post" enctype="multipart/form-data">
        <h2 class="text-2xl text-center">Create Post</h2>
        {% csrf_token %}
        {{ form }}
        <button class="bg-blue-500 text-white font-bold mt-4 px-4 py-2 w-full rounded-lg cursor-pointer" type="submit">Create</button>
      </form>
    </div>
  </div>
{% endblock content %}
