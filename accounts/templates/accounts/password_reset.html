{% extends "accounts/box.html" %}

{% block box %}
  <form class="space-y-4" method="post">
    {% csrf_token %}
    <h1 class="text-center text-3xl font-bold spacing-tight">Reset Password</h1>
    <p>Please enter your email. We would send you an email consisting the link for resetting your password.</p>
    {% include "accounts/form_snippet.html" %}
    <button class="hover:bg-blue-600 bg-blue-500 text-white font-bold px-4 py-2 w-full rounded-lg cursor-pointer" type="submit">Submit</button>
  </form>
{% endblock box %}
