{% extends "base.html" %}
{% load static %}

{% block content %}
  <div class="container mx-auto h-full flex justify-center items-center">
    <div class="flex flex-col items-center space-y-2">
      <img
        class="w-32 h-32 object-cover rounded-full"
        src="{% if user.profile.image %}{{ user.profile.image.url }}{% else %}{% static 'images/user_placeholder.png' %}{% endif %}"
        alt="{{ user.username }}">
      <h2 class="text-2xl">{{ user.username }}</h2>
      <p>{{ user.first_name }}</p>
      <p>{{ user.last_name }}</p>
      <p>{{ user.email }}</p>
      <a class="mt-6 bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded-lg" href="{% url "accounts:password-change" %}">Change Password</a>
      <a class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded-lg" href="{% url "accounts:profile-edit" %}">Edit Profile</a>
      <form action="{% url 'accounts:logout' %}" method="post">
        {% csrf_token %}
        <button class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded-lg" type="submit">Logout</button>
      </form>
    </div>
  </div>
{% endblock content %}
