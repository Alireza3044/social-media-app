{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col justify-center items-center min-h-screen p-10 space-y-2">
    <img class="w-32 max-h-32" src="/media/{{ user.profile.image }}" alt="{{ user.username }}">
    <h2 class="text-2xl">{{ user.username }}</h2>
    <p>{{ user.first_name }}</p>
    <p>{{ user.last_name }}</p>
    <p>{{ user.email }}</p>
    <a class="mt-6 bg-blue-500 text-white font-bold px-4 py-2 rounded-lg" href="{% url "accounts:password-change" %}">Change Password</a>
  </div>
{% endblock content %}
