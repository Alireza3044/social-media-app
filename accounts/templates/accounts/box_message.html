{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col justify-center items-center min-h-screen p-10">
    <div method="post" class="shadow-2xl px-10 py-6 rounded-lg w-90">
      <h1 class="text-center text-2xl font-bold spacing-tight mb-4">{{ header }}</h1>
      {% if message %}
        <p>{{ message }}</p>
      {% endif %}
      {% if btn_text and path_name %}
        <div class="flex justify-center">
          <a class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded-lg" href="{% url path_name %}">{{ btn_text }}</a>
        </div>
      {% endif %}
    </div>
  </div>
{% endblock content %}
