{% extends "base.html" %}

{% block content %}
  <div class="flex flex-col justify-center items-center min-h-screen p-10">
    <form method="post" class="shadow-2xl space-y-4 p-10 rounded-lg w-90">
      <h1 class="text-center text-3xl font-bold spacing-tight">Register</h1>
      {% csrf_token %}
      {{ form }}
      <button class="bg-blue-500 text-white font-bold px-4 py-2 w-full rounded-lg cursor-pointer" type="submit">Register</button>
    </form>
  </div>
{% endblock content %}
