{% load tailwind_cli %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media App</title>
  {% tailwind_css %}
</head>
<body>
  {% if messages %}
    {% for message in messages %}
      <div class="bg-green-500 text-green-700">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock content %}
</body>
</html>
